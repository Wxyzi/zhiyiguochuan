<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="SimHei, 'Microsoft YaHei', sans-serif">
  <!-- 五部分输出结构图 -->

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a3a5c">智译国传智能体五部分输出结构</text>

  <!-- 标题区说明 -->
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#3a5a7a">智能体默认输出（output_mode = full_news_translation_with_quality_report）</text>

  <!-- 部分 1: Final Translation -->
  <rect x="40" y="80" width="640" height="48" rx="6" fill="#e8f1fb" stroke="#2a6fb5" stroke-width="1.5"/>
  <text x="70" y="103" font-size="13" font-weight="700" fill="#1a3a5c">Final Translation</text>
  <text x="70" y="120" font-size="11" fill="#3a5a7a">完整英文译文。保留原文事实、术语和限定语，符合英文新闻写作习惯。</text>

  <!-- 部分 2: Headline Options -->
  <rect x="40" y="140" width="640" height="48" rx="6" fill="#e8f1fb" stroke="#2a6fb5" stroke-width="1.5"/>
  <text x="70" y="163" font-size="13" font-weight="700" fill="#1a3a5c">Headline Options</text>
  <text x="70" y="180" font-size="11" fill="#3a5a7a">三个英文标题备选。避免 validate、prove、drive 等动词，保留限定语。</text>

  <!-- 部分 3: Term Table -->
  <rect x="40" y="200" width="640" height="48" rx="6" fill="#e6f4ea" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="70" y="223" font-size="13" font-weight="700" fill="#1d4d36">Term Table</text>
  <text x="70" y="240" font-size="11" fill="#2d5a3d">术语表：中文术语 | 推荐译法 | 处理说明。不确定项标记"需人工确认"。</text>

  <!-- 部分 4: Fact Checklist -->
  <rect x="40" y="260" width="640" height="48" rx="6" fill="#fff4e6" stroke="#e88a1a" stroke-width="1.5"/>
  <text x="70" y="283" font-size="13" font-weight="700" fill="#9a5a0a">Fact Checklist</text>
  <text x="70" y="300" font-size="11" fill="#a86a1a">事实核对表：类型 | 原文信息 | 译文处理 | 状态。核查人名、机构、数字、时间。</text>

  <!-- 部分 5: Human Review Notes -->
  <rect x="40" y="320" width="640" height="48" rx="6" fill="#fce8f0" stroke="#a83d6e" stroke-width="1.5"/>
  <text x="70" y="343" font-size="13" font-weight="700" fill="#7a2a52">Human Review Notes</text>
  <text x="70" y="360" font-size="11" fill="#7a2a52">人工复核提示：列出需要人工复核的内容和原因。无明显风险时仍建议人工通读。</text>
</svg>
