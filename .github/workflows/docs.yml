# ============================================================================
# 智译国传智能体技术文档 - DITA Docs CI/CD
#
# CI: check XML well-formedness and build the DITA map on every push and PR.
# CD: build HTML5 + PDF documentation and deploy it to GitHub Pages on main/master.
#
# Note:
# The cloud PDF uses the open-source DITA-OT PDF transformation. The locally
# generated Oxygen PDF Chemistry output can still be used when a more polished
# print-ready PDF is needed.
# ============================================================================

name: DITA Docs CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'maps/**'
      - 'topics/**'
      - 'templates/**'
      - 'scripts/**'
      - 'styles/**'
      - 'ditaval/**'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'maps/**'
      - 'topics/**'
      - 'templates/**'
      - 'scripts/**'
      - 'styles/**'
      - 'ditaval/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dita-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DITA_OT_VERSION: 4.2.4
  MAIN_MAP: maps/zhiya-guochuan-agent.ditamap

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei poppler-utils
          fc-cache -f
          test -f /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
          fc-match "WenQuanYi Micro Hei"

      - name: Install DITA-OT
        run: |
          curl --fail --retry 3 -L -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          unzip -q dita-ot.zip
          cp styles/font-mappings-zh-cn.xml "dita-ot-${DITA_OT_VERSION}/plugins/org.dita.pdf2/cfg/fo/font-mappings.xml"
          echo "$PWD/dita-ot-${DITA_OT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check XML well-formedness
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for pattern in ("maps/**/*.ditamap", "topics/**/*.dita", "templates/**/*.ditamap", "templates/**/*.dita"):
              for file in Path(".").glob(pattern):
                  try:
                      ET.parse(file)
                  except ET.ParseError as exc:
                      failed = True
                      print(f"::error file={file}::{exc}")
          if failed:
              sys.exit(1)
          PY

      - name: Build starter template
        run: |
          dita \
            -i templates/agent-docs/maps/agent.ditamap \
            -f html5 \
            -o build/starter-template \
            --outer.control=quiet

      - name: Build HTML5 site
        run: |
          dita \
            -i "$MAIN_MAP" \
            -f html5 \
            -o site \
            --filter=ditaval/customer-release.ditaval \
            --outer.control=quiet
          python scripts/prepare_site.py site

      - name: Build PDF
        run: |
          dita \
            -i "$MAIN_MAP" \
            -f pdf \
            -o pdf \
            --args.output.base=zhiya-guochuan-agent \
            --args.fo.userconfig="$PWD/styles/fop-zh-cn.xconf" \
            --filter=ditaval/customer-release.ditaval \
            --outer.control=quiet
          mkdir -p site/pdf
          pdf_file="$(find pdf -type f -name '*.pdf' | head -n 1)"
          if [ -z "$pdf_file" ]; then
            echo "::error::PDF build did not produce a PDF file."
            exit 1
          fi
          cp "$pdf_file" site/pdf/zhiya-guochuan-agent.pdf
          fonts_report="$(pdffonts site/pdf/zhiya-guochuan-agent.pdf)"
          echo "$fonts_report"
          if ! echo "$fonts_report" | grep -Eiq 'WenQuanYi|WQY'; then
            echo "::error::PDF does not appear to embed the configured Chinese font."
            exit 1
          fi
          pdf_text="$(LC_ALL=C.UTF-8 pdftotext site/pdf/zhiya-guochuan-agent.pdf - || true)"
          if ! printf '%s' "$pdf_text" | grep -q '智译国传'; then
            echo "::error::PDF text extraction did not find expected Chinese text."
            exit 1
          fi
          touch site/.nojekyll
          python scripts/prepare_site.py site --check

      - name: Upload site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiya-guochuan-agent-site
          path: site
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
