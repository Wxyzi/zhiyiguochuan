# ============================================================================
# 智译国传智能体技术文档 - DITA Docs CI/CD
#
# CI: check XML well-formedness and build the DITA map on every push and PR.
# CD: build HTML5 documentation and deploy it to GitHub Pages on main/master.
#
# Note:
# The local PDF uses Oxygen PDF CSS / PDF Chemistry (`pdf-css-html5`), which is
# not available on the default GitHub-hosted runner. The cloud pipeline therefore
# publishes the open-source DITA-OT HTML5 output. Generate the styled PDF locally
# with Oxygen XML Editor 28.1 when a print-ready deliverable is needed.
# ============================================================================

name: DITA Docs CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'maps/**'
      - 'topics/**'
      - 'styles/**'
      - 'ditaval/**'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'maps/**'
      - 'topics/**'
      - 'styles/**'
      - 'ditaval/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dita-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DITA_OT_VERSION: 4.2.4
  MAIN_MAP: maps/zhiya-guochuan-agent.ditamap

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install DITA-OT
        run: |
          curl -L -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          unzip -q dita-ot.zip
          echo "$PWD/dita-ot-${DITA_OT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check XML well-formedness
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for pattern in ("maps/**/*.ditamap", "topics/**/*.dita"):
              for file in Path(".").glob(pattern):
                  try:
                      ET.parse(file)
                  except ET.ParseError as exc:
                      failed = True
                      print(f"::error file={file}::{exc}")
          if failed:
              sys.exit(1)
          PY

      - name: Build HTML5 site
        run: |
          dita \
            -i "$MAIN_MAP" \
            -f html5 \
            -o site \
            --outer.control=quiet
          touch site/.nojekyll

      - name: Upload HTML5 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhiya-guochuan-agent-html5
          path: site
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
